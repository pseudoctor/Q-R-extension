name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - name: Run static checks
        run: |
          pnpm exec oxlint .
          pnpm exec tsc -b
          pnpm build
          pnpm check:extension
          pnpm check:store-assets
          pnpm check:release
      - name: Run regression checks
        run: |
          pnpm check:article-format
          pnpm check:pre-reading
          pnpm check:training-flow
          pnpm check:i18n
          pnpm check:storage-concurrency
          pnpm check:training-audit
          pnpm check:ai-storage
          pnpm check:message-security
          pnpm check:ai-http
          pnpm check:provider-settings
      - name: Run browser smoke test
        run: pnpm check:browser
