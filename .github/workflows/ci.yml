name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.14.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Install Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
      - name: Run static checks
        run: |
          pnpm exec oxlint .
          pnpm exec tsc -b
          pnpm build
          pnpm check:extension
          pnpm check:store-assets
          pnpm check:release
      - name: Run regression checks
        run: |
          pnpm check:article-format
          pnpm check:pre-reading
          pnpm check:training-flow
          pnpm check:i18n
          pnpm check:storage-concurrency
          pnpm check:training-audit
          pnpm check:ai-storage
          pnpm check:message-security
          pnpm check:ai-http
          pnpm check:provider-settings
      - name: Run browser smoke test
        run: pnpm check:browser
